apiVersion: v1
kind: Config
clusters:
  - name: prod-shanghai
    cluster:
      server: https://k8s-prod.example.com
      insecure-skip-tls-verify: true
  - name: dev-kind
    cluster:
      server: https://127.0.0.1:6443
users:
  - name: platform-admin
    user:
      token: redacted-token
  - name: developer
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubelogin
contexts:
  - name: prod-admin
    context:
      cluster: prod-shanghai
      user: platform-admin
      namespace: default
  - name: dev-frontend
    context:
      cluster: dev-kind
      user: developer
      namespace: frontend
